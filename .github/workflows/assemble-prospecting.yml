name: Assemble Prospecting script

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble and verify
        shell: bash
        run: |
          set -e
          : > Prospecting_Standalone.lua
          for f in .upload-chunks/chunk-*.txt; do
            cat "$f" >> Prospecting_Standalone.lua
            printf '\n' >> Prospecting_Standalone.lua
          done

          EXPECTED="94ab7bb79de73e90cdb6b7cc2ccea2c8f452f482d31c1c9262248c4e7f246243"
          ACTUAL="$(sha256sum Prospecting_Standalone.lua | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"

      - name: Commit final file and clean upload chunks
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .upload-chunks .github/workflows/assemble-prospecting.yml
          git add Prospecting_Standalone.lua .upload-chunks .github/workflows/assemble-prospecting.yml
          git commit -m "Add Prospecting standalone script"
          git push
